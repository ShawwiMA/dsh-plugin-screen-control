name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  package:
    name: 源码 + 发布包体检
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Rust 侧必须有：之前 CI 完全不碰 Rust，编译错误、单测失败、引擎与源码不一致
      # 全都能静默通过 —— 发布出来的 exe 和仓库源码对不上也没人发现。
      - uses: dtolnay/rust-toolchain@stable

      - name: Rust 单元测试
        working-directory: rust-engine
        run: cargo test --release

      - name: Rust 编译 release 引擎
        working-directory: rust-engine
        run: cargo build --release

      # 先把刚编出来的引擎同步进 bin/，再逐字节比对。
      #
      # 为什么不是直接 --check：Rust 的 release 产物**不是可复现构建**（编译器版本、
      # 依赖哈希、LTO 都会影响字节），要求 CI 产物和仓库里已提交的 exe 逐字节相同
      # 必然失败。正确做法是"CI 现编 → 用它覆盖 bin → 再验证 bin 与 target 一致"，
      # 这样发布出去的引擎一定和源码同一份，也不依赖本地构建环境。
      - name: 同步引擎（用现编产物覆盖 bin）
        run: node scripts/sync-engine.mjs

      - name: 引擎版本守卫（现编现比）
        run: node scripts/sync-engine.mjs --check --require-built

      - name: 发布包内容体检
        run: node scripts/verify-pack.mjs

  # TypeScript 侧的类型检查和 selfcheck 需要 @deepseek-ai/* 的类型包，
  # 而 devDependencies 用的是本机 file: 链接（../../profiles/node_modules/...），
  # 在 GitHub runner 上不存在。所以这两步暂时只在本地跑，等 devDeps 换成可安装的
  # 版本再搬进 CI。发布前请本地执行：npm run typecheck && npm run selfcheck
