name: Publish

# 由 npm 的 OIDC 可信发布（Trusted Publisher）驱动，不需要任何长期 token。
# 发版流程：改 package.json 版本 → 提交 → 打 tag 并推送 → 这个 workflow 自动发布。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC 必需：用它向 npm 换取一次性发布凭证

jobs:
  publish:
    name: 发布到 npm
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # 可信发布要求 npm CLI >= 11.5.1，node 24 自带的版本不一定够，统一升到 latest。
      - name: 升级 npm
        run: npm install -g npm@latest

      - uses: dtolnay/rust-toolchain@stable

      # 发布包里的 exe 必须现编：不能拿仓库 bin/ 里的旧产物发布，
      # 否则用户装到的引擎和 tag 上的源码不是同一份。
      - name: 编译 release 引擎
        working-directory: rust-engine
        run: cargo build --release

      - name: 引擎版本守卫（现编现比）
        run: node scripts/sync-engine.mjs --check --require-built

      - name: 发布包体检
        run: node scripts/verify-pack.mjs

      # 不带 NODE_AUTH_TOKEN：OIDC 会在这一步自动换凭证。
      - name: 发布
        run: npm publish --provenance
