# ============================================================================
# dsh-plugin-screen-control —— 本地开发 overlay
# ============================================================================
# 与 cordis.patch.yml 内容相同,区别在用途:
#   cordis.patch.yml —— 作为 npm bundle 依赖被 profile 自动应用(正式安装)
#   cordis.yml       —— 手动 overlay,启动时用 --patch 指向本文件(免安装调试)
#
# 用法(改完重启 dsh 生效):
#   dsh --profile desktop --patch "C:\Users\69544\.dsh\bundles\dsh-plugin-screen-control\cordis.yml"
#
# 前提:插件已被 profile 解析到(node_modules 里能 require 到
# `dsh-plugin-screen-control`)。没装依赖时先跑 scripts/link-into-profile.ps1。
# ============================================================================

- insert:
    - id: screen-control
      name: dsh-plugin-screen-control
